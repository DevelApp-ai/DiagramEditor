name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish diagnostics on failure
        if: failure() && github.ref == 'refs/heads/fix/mcp-editor-readiness'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# CI diagnostics"
            npm run lint
            npm run typecheck
            npm run build
            npm run test:coverage
          } > ci-diagnostics.txt 2>&1 || true
          head -c 20000 ci-diagnostics.txt > ci-diagnostics-trimmed.txt
          echo ""
          echo "(output trimmed to 20000 chars)" >> ci-diagnostics-trimmed.txt
          gh pr comment 32 --body-file ci-diagnostics-trimmed.txt

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3.97.9
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
