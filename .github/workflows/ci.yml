name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Publish diagnostics on failure
        if: failure() && github.ref == 'refs/heads/fix/mcp-editor-readiness'
        run: |
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          {
            echo "# CI diagnostics"
            npm run lint
            npm run typecheck
            npm run build
            npm run test:coverage
          } > ci-diagnostics.txt 2>&1 || true
          git fetch origin
          git rebase origin/fix/mcp-editor-readiness || { git rebase --abort; exit 0; }
          git add ci-diagnostics.txt
          git commit -m "chore: record CI diagnostics [skip ci]" || echo "nothing to commit"
          git push || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3.97.9
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
