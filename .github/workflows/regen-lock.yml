name: Regenerate lockfile

on:
  push:
    branches: [fix/mcp-editor-readiness]

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Regenerate lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! npm install --package-lock-only --no-audit --no-fund > regen-diag.txt 2>&1; then
            cat regen-diag.txt
            { echo "# Lockfile regen failure"; cat regen-diag.txt; } | head -c 20000 | gh pr comment 32 --body-file - || true
            exit 1
          fi

      - name: Commit updated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ci-lockfile"
          git config user.email "ci-lockfile@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          for i in 1 2 3; do
            git commit -m "chore: regenerate package-lock.json"
            git fetch origin
            git rebase origin/fix/mcp-editor-readiness || { git rebase --abort; exit 1; }
            if git push; then
              exit 0
            fi
          done
          { echo "# Could not push lockfile after retries"; } | gh pr comment 32 --body-file - || true
          exit 1
