name: Audit fix (temporary)

on:
  push:
    branches: [chore/audit-fix]

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Audit before fix
        run: npm audit --audit-level=high --json > audit-before.json || true
      - name: Apply audit fix
        run: npm audit fix --audit-level=high || true
      - name: Audit after fix
        run: npm audit --audit-level=high --json > audit-after.json || true
      - name: Write report
        run: |
          node -e '
            const fs = require("fs");
            const read = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch { return null; } };
            const before = read("audit-before.json");
            const after = read("audit-after.json");
            const vulns = (j) => (j && j.vulnerabilities ? Object.values(j.vulnerabilities) : []);
            const lines = ["# Temporary audit report", ""];
            lines.push("## Before (" + vulns(before).length + " advisories)");
            for (const v of vulns(before)) lines.push("- " + v.name + "@" + (v.range ?? "") + " severity=" + v.severity + " fixAvailable=" + JSON.stringify(v.fixAvailable).slice(0, 200) + " via=" + JSON.stringify(v.via).slice(0, 400));
            lines.push("");
            lines.push("## After (" + vulns(after).length + " advisories)");
            for (const v of vulns(after)) lines.push("- " + v.name + "@" + (v.range ?? "") + " severity=" + v.severity + " fixAvailable=" + JSON.stringify(v.fixAvailable).slice(0, 200) + " via=" + JSON.stringify(v.via).slice(0, 400));
            fs.writeFileSync("AUDIT-REPORT.md", lines.join("\n") + "\n");
          '
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; stopping."
            exit 0
          fi
          git commit -m "chore: apply npm audit fix and record audit report"
          git push
